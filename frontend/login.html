<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Colored Lists</title>
<link rel="stylesheet" href="login.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<header class="navbar">
	  <div class="container-fluid">
	    <h1><a class="navbar-brand" href="/"> <span class="logo">Colored</span>Lists</a></h1>
	    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
	      data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" 
	      aria-expanded="false" aria-label="Toggle navigation">
	      <span class="navbar-toggler-icon"></span>
	    </button>

	    <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
	      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
	        <li class="nav-item"><a class="nav-link active" href="/">Login</a></li>
	        <li class="nav-item"><a class="nav-link" href="Signup.html">Signup</a></li>
	      </ul>
	    </div>
	  </div>
	</header>

	<main class="container my-4">
		<div class="auth-container">
			<div class="auth-card">
				<h2>Welcome Back</h2>
				<p class="auth-description">Sign in to your account to continue organizing your lists</p>
				
				<form id="loginForm">
					<div class="mb-3">
						<input type="email" id="email" class="form-control" placeholder="Email" required>
					</div>
					<div class="mb-3">
						<input type="password" id="password" class="form-control" placeholder="Password" required>
					</div>
					<button type="submit" class="btn btn-primary w-100 login-submit">Login</button>
					
					<div class="auth-links">
						<p>Don't have an account? <a href="Signup.html">Sign up here</a></p>
					</div>
				</form>
				
				<div id="loginError" class="alert alert-danger" style="display: none;"></div>
				<div id="loginSuccess" class="alert alert-success" style="display: none;"></div>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script>
	const SUPABASE_URL = "https://naolniqjndbevsytsnwu.supabase.co";
	const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hb2xuaXFqbmRiZXZzeXRzbnd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcxOTY5MTUsImV4cCI6MjA3Mjc3MjkxNX0.PhSFQO69hWLMFaaPv3UHAIxhow9k3XDNSIMS_sbmVps";
	const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

	const errorDiv = document.getElementById('loginError');
	const successDiv = document.getElementById('loginSuccess');

	function showError(message) {
		errorDiv.textContent = message;
		errorDiv.style.display = 'block';
		successDiv.style.display = 'none';
	}

	function showSuccess(message) {
		successDiv.textContent = message;
		successDiv.style.display = 'block';
		errorDiv.style.display = 'none';
	}

	document.getElementById("loginForm").addEventListener("submit", async (e) => {
		e.preventDefault();
		
		const email = document.getElementById("email").value.trim();
		const password = document.getElementById("password").value.trim();

		if (!email || !password) {
			showError("Please fill in all fields");
			return;
		}

		try {
			const { data, error } = await supabaseClient.auth.signInWithPassword({
				email,
				password,
			});

			if (error) {
				showError("Login failed: " + error.message);
			} else {
				showSuccess("Login successful! Redirecting...");
				
				// Store session info if needed
				if (data.session) {
					localStorage.setItem('supabase.auth.token', JSON.stringify(data.session));
				}
				
				setTimeout(() => {
					window.location.href = "/home";
				}, 1500);
			}
		} catch (err) {
			showError("An unexpected error occurred. Please try again.");
			console.error('Login error:', err);
		}
	});
	</script>
</body>
</html>
