<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Colored Lists</title>
<link rel="stylesheet" href="signup.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<header class="navbar">
	  <div class="container-fluid">
	    <h1><a class="navbar-brand" href="/"> <span class="logo">Colored</span>Lists</a></h1>
	    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
	      data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" 
	      aria-expanded="false" aria-label="Toggle navigation">
	      <span class="navbar-toggler-icon"></span>
	    </button>

	    <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
	      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
	        <li class="nav-item"><a class="nav-link" href="/">Login</a></li>
	        <li class="nav-item"><a class="nav-link active" href="Signup.html">Signup</a></li>
	      </ul>
	    </div>
	  </div>
	</header>

	<main class="container my-4">
		<div class="auth-container">
			<div class="auth-card">
				<h2>Create Account</h2>
				<p class="auth-description">Join ColoredLists to start organizing your tasks with style</p>
				
				<form id="signupForm">
					<div class="mb-3">
						<input type="text" id="username" class="form-control" placeholder="Username (optional)">
					</div>
					<div class="mb-3">
						<input type="email" id="email" class="form-control" placeholder="Email" required>
					</div>
					<div class="mb-3">
						<input type="password" id="password" class="form-control" placeholder="Password (min 6 characters)" required>
					</div>
					<div class="mb-3">
						<input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
					</div>
					<button type="submit" class="btn btn-primary w-100 signup-submit">Create Account</button>
					
					<div class="auth-links">
						<p>Already have an account? <a href="/">Login here</a></p>
					</div>
				</form>
				
				<div id="signupError" class="alert alert-danger" style="display: none;"></div>
				<div id="signupSuccess" class="alert alert-success" style="display: none;"></div>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script>
	const SUPABASE_URL = "https://naolniqjndbevsytsnwu.supabase.co";
	const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hb2xuaXFqbmRiZXZzeXRzbnd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcxOTY5MTUsImV4cCI6MjA3Mjc3MjkxNX0.PhSFQO69hWLMFaaPv3UHAIxhow9k3XDNSIMS_sbmVps";
	const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

	const errorDiv = document.getElementById('signupError');
	const successDiv = document.getElementById('signupSuccess');

	function showError(message) {
		errorDiv.textContent = message;
		errorDiv.style.display = 'block';
		successDiv.style.display = 'none';
	}

	function showSuccess(message) {
		successDiv.textContent = message;
		successDiv.style.display = 'block';
		errorDiv.style.display = 'none';
	}

	document.getElementById("signupForm").addEventListener("submit", async (e) => {
		e.preventDefault();
		
		const username = document.getElementById("username").value.trim();
		const email = document.getElementById("email").value.trim();
		const password = document.getElementById("password").value.trim();
		const confirmPassword = document.getElementById("confirmPassword").value.trim();

		// Validation
		if (!email || !password) {
			showError("Email and password are required");
			return;
		}

		if (password.length < 6) {
			showError("Password must be at least 6 characters long");
			return;
		}

		if (password !== confirmPassword) {
			showError("Passwords do not match");
			return;
		}

		try {
			const { data, error } = await supabaseClient.auth.signUp({
				email,
				password,
				options: {
					data: {
						username: username || email.split('@')[0]
					}
				}
			});

			if (error) {
				showError("Signup failed: " + error.message);
			} else {
				showSuccess("Account created successfully! Please check your email to verify your account.");
				
				setTimeout(() => {
					window.location.href = "/";
				}, 3000);
			}
		} catch (err) {
			showError("An unexpected error occurred. Please try again.");
			console.error('Signup error:', err);
		}
	});
	</script>
</body>
</html>
