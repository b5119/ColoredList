	<script>

	const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hb2xuaXFqbmRiZXZzeXRzbnd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcxOTY5MTUsImV4cCI6MjA3Mjc3MjkxNX0.PhSFQO69hWLMFaaPv3UHAIxhow9k3XDNSIMS_sbmVps";
	const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

	const taskContainer = document.getElementById("taskContainer");
	const taskInput = document.getElementById("taskInput");

	// --- Load tasks ---
	async function loadTasks() {
	    const { data, error } = await supabaseClient.from("items").select("*");

	            else loadTasks();
	        });

	    else {

	        loadTasks();
	    }
	});

	// Load tasks on page load
	loadTasks();
	</script>

  <script>
const listContainer = document.getElementById('lists');
let lists = [];
let draggedItem = null;

// Fetch all lists
async function fetchLists() {
  const res = await fetch('/lists');
  lists = await res.json();
  renderLists();
}

// Render lists
function renderLists() {
  listContainer.innerHTML = '';
  lists
    .sort((a,b) => a.position - b.position)
    .forEach(list => {
      const div = document.createElement('div');
      div.className = 'list-item';
      div.draggable = true;
      div.dataset.id = list.list_id;

      div.innerHTML = `
        <span contenteditable="true" class="list-name">${list.name}</span>
        <button class="delete-btn">Delete</button>
      `;

      div.querySelector('.delete-btn').addEventListener('click', () => handleDelete(list.list_id));
      div.querySelector('.list-name').addEventListener('blur', e => handleUpdate(list.list_id, e.target.innerText));
      div.addEventListener('dragstart', dragStart);
      div.addEventListener('dragover', dragOver);
      div.addEventListener('drop', drop);

      listContainer.appendChild(div);
    });
}

// Delete list
async function handleDelete(id) {
  const res = await fetch(`/lists/${id}`, { method: 'DELETE' });
  const data = await res.json();
  console.log(data.message);
  lists = lists.filter(list => list.list_id !== id);
  renderLists();
}

// Update list name
async function handleUpdate(id, newName) {
  const res = await fetch(`/lists/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: newName })
  });
  const data = await res.json();
  console.log(data.message);
  const index = lists.findIndex(l => l.list_id === id);
  if(index > -1) lists[index].name = newName;
}

// Drag & Drop
function dragStart(e) { draggedItem = e.currentTarget; }
function dragOver(e) { 
  e.preventDefault(); 
  const target = e.currentTarget;
  if(target && target !== draggedItem) {
    const rect = target.getBoundingClientRect();
    const next = (e.clientY - rect.top)/rect.height > 0.5;
    target.parentNode.insertBefore(draggedItem, next && target.nextSibling || target);
  }
}
function drop() {
  const reordered = Array.from(listContainer.children).map((div, index) => ({
    list_id: parseInt(div.dataset.id),
    position: index
  }));
  fetch('/lists/reorder', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ reorderedLists: reordered })
  }).then(res => res.json()).then(d => console.log(d.message));
}

// Initialize
fetchLists();
</script>
